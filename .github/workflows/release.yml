name: release

# Runs when the owner pushes a version tag (v0.2.0 …), or by hand for an existing tag: tests, scans and builds the
# package, then creates the GitHub Release with the wheel, the sdist and the CHANGELOG entry (skipped if it already
# exists). Publishing to PyPI is opt-in: set the repository variable PYPI_PUBLISH to "true" once the PyPI trusted
# publisher is configured (owner mikedconcepcion, repository memcrumbs, workflow release.yml, environment pypi).
# No token is stored anywhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag to release again, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$TAG" || { echo "tag $TAG != version $v"; exit 1; }
      - run: python -m pip install -e . && python -m unittest discover -s tests
      - run: memcrumbs scan .
      - run: python -m pip install build twine && python -m build
      - run: python -m twine check dist/*
      - run: for f in dist/*; do memcrumbs scan "$f"; done
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: release notes from CHANGELOG.md
        run: |
          python - > notes.md <<'PY'
          import os, re
          v = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"(?ms)^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(v), text)
          print(m.group(1).strip() if m else "See CHANGELOG.md.")
          PY
      - name: create the release (once)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; else
            gh release create "$TAG" dist/* --title "memcrumbs $TAG" --notes-file notes.md; fi
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
