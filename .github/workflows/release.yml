name: release

# Runs only when the owner pushes a version tag (v0.2.0 …): tests, scans and builds the package, then creates a
# GitHub Release with the wheel, the sdist and the CHANGELOG entry. Publishing to PyPI is opt-in: set the repository
# variable PYPI_PUBLISH to "true" once a PyPI trusted publisher is configured. It then waits for approval on the
# `pypi` environment (no token stored in the repo).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: python -m pip install -e . && python -m unittest discover -s tests
      - run: memcrumbs scan .
      - run: python -m pip install build && python -m build
      - run: for f in dist/*; do memcrumbs scan "$f"; done
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: release notes from CHANGELOG.md
        run: |
          python - > notes.md <<'PY'
          import os, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"(?ms)^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(v), text)
          print(m.group(1).strip() if m else "See CHANGELOG.md.")
          PY
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "memcrumbs $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
