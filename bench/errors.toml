# Error text pasted as it is, unquoted: `find` tries it as an exact phrase first.
# Recorded strings expect the page that records them; strings nothing records are `new = true`, and the right
# answer says the text is not recorded.

[[q]]
id = "er-01"
category = "error"
q = "sqlite3.OperationalError: database is locked"
expect = ["wiki/incidents/2026-07-11-bookings-db-locked-by-backup.md"]

[[q]]
id = "er-02"
category = "error"
q = "sqlite3.OperationalError: disk I/O error"
expect = ["wiki/incidents/2026-08-16-disk-full-web-srv.md"]

[[q]]
id = "er-03"
category = "error"
q = "the task finishes in 0 seconds with result 0x1"
expect = ["wiki/incidents/2026-07-29-bom-breaks-scheduled-task.md"]

[[q]]
id = "er-04"
category = "error"
q = "BookingWeb answered 500 with database is locked"
expect = ["wiki/incidents/2026-07-11-bookings-db-locked-by-backup.md"]

