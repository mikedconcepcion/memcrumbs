[[q]]
id = "dev-doc-08"
q = "Let a slow host take up to a minute to accept the connection, but keep other waits at 10 seconds."
expect = ["docs/advanced/timeouts.md#Fine tuning the configuration"]
category = "howto"

[[q]]
id = "dev-doc-09"
q = "I must hit a server by raw IP address but still have certificate checks use its real hostname."
