# httpx dev questions (for tuning), written blind. Repo: encode/httpx @ b5addb64.

# ---------------------------------------------------------------- howto (docs)

[[q]]
id = "dev-doc-01"
q = "Can I point a client at a local socket file, like the Docker engine's, instead of a TCP host?"
expect = ["docs/advanced/transports.md#HTTP Transport"]
category = "howto"

[[q]]
id = "dev-doc-02"
q = "Show a live progress bar while saving a huge file the server sends back."
expect = ["docs/advanced/clients.md#Monitoring download progress"]
category = "howto"

[[q]]
id = "dev-doc-03"
q = "Our internal API wants the caller to present its own certificate. How do I attach one?"
expect = ["docs/advanced/ssl.md#Client side certificates"]
category = "howto"

[[q]]
id = "dev-doc-04"
q = "How do I exercise my Flask app in unit tests by sending requests straight into it, no running server?"
expect = ["docs/advanced/transports.md#WSGI Transport"]
category = "howto"

[[q]]
id = "dev-doc-05"
q = "Our outbound proxy requires a login. Where do I put the username and password?"
expect = ["docs/advanced/proxies.md#Authentication"]
category = "howto"

[[q]]
id = "dev-doc-06"
q = "When the access token expires the API answers 401; how do I refresh it and replay the call automatically?"
expect = ["docs/advanced/authentication.md#Custom authentication schemes"]
category = "howto"

[[q]]
id = "dev-doc-07"
q = "A legacy site sends no charset and the text comes out garbled. Can httpx guess the encoding?"
expect = ["docs/advanced/text-encodings.md#Using auto-detection"]
