[[q]]
id = "dev-doc-10"
q = "Which logger names do I configure to see connection-level debug output from the library?"
expect = ["docs/logging.md"]
category = "howto"

[[q]]
id = "dev-doc-11"
q = "How do I run my own function on every outgoing call and every reply, e.g. to stamp a header?"
expect = ["docs/advanced/event-hooks.md"]
